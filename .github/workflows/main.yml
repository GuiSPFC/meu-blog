name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Instalar dependências
      run: npm ci

    - name: Rodar lint
      run: npm run lint

    - name: Rodar testes
      run: npm run test

    - name: Instalar Vercel CLI globalmente
      run: npm install -g vercel

    - name: Criar configurações locais da Vercel
      run: |
        mkdir -p .vercel
        echo '{"projectId":"${{ secrets.VERCEL_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}' > .vercel/project.json

    - name: Pull
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

    - name: Build
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

    - name: Realizar Deploy via Tokens para a Vercel
      run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
